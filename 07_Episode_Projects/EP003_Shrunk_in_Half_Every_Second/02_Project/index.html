<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What If You Shrunk in Half Every Second?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="grade"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="ui">
    <h1 id="title"></h1>
    <div id="counter">
      <div class="sec"><span class="lab">SECOND</span><span id="c-sec">0</span></div>
      <div class="row"><span class="lab">HEIGHT</span><span id="c-h" class="big">1.8 m</span></div>
      <div class="row"><span class="lab">SMALLER THAN</span><span id="c-than" class="than">—</span></div>
      <div id="tag"></div>
    </div>
    <p id="caption"></p>
  </div>
  <div id="fade"></div>
  <div id="card"><span class="k"></span></div>
</div>
<div id="controls" hidden>
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" step="0.01" value="0">
  <span id="clock">0.0s</span>
</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="main.js"></script>
</body>
</html>
